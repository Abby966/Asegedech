<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volunteer – Add Task & Appointments</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--brand:#f97316}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .shadow-soft{box-shadow:0 12px 30px rgba(2,6,23,.08)}
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-bold">Aged Care & Dignity – Volunteer</h1>
      <nav class="flex items-center gap-2">
        <a href="/index.html" class="px-3 py-1.5 rounded-full border border-slate-200 hover:bg-slate-50">Home</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <div class="grid lg:grid-cols-3 gap-6 items-start">

      <!-- Left: Add Task Appointment (no login) -->
      <section class="lg:col-span-2">
        <div class="rounded-2xl bg-white p-5 shadow-soft">
          <h2 class="text-xl font-bold mb-1">Add Task Appointment (No Login)</h2>
          <p class="text-slate-500 mb-4">Fill this to request an appointment. If the chosen day is already booked for that task, it will be rejected.</p>
          <form id="publicBookForm" class="grid gap-3" novalidate>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="text-sm font-semibold">Your Name</label>
                <input name="name" type="text" class="w-full rounded-xl border border-slate-200 px-3 py-2" placeholder="Full name" required />
              </div>
              <div>
                <label class="text-sm font-semibold">Phone</label>
                <input name="phone" type="tel" class="w-full rounded-xl border border-slate-200 px-3 py-2" placeholder="+251..." required />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="text-sm font-semibold">Task</label>
                <select name="task" id="taskSelect" class="w-full rounded-xl border border-slate-200 px-3 py-2" required>
                  <option value="" selected disabled>Choose...</option>
                  <option>Cleaning</option>
                  <option>Celebrating holiday</option>
                  <option>Gardening</option>
                  <option>Visiting/Reading</option>
                  <option value="__other__">Other (type below)</option>
                </select>
              </div>
              <div>
                <label class="text-sm font-semibold">Other Task (optional)</label>
                <input name="taskOther" type="text" class="w-full rounded-xl border border-slate-200 px-3 py-2" placeholder="e.g., Cooking, Decoration" />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="text-sm font-semibold">Date</label>
                <input name="date" type="date" class="w-full rounded-xl border border-slate-200 px-3 py-2" required />
              </div>
              <div>
                <label class="text-sm font-semibold">Time</label>
                <input name="time" type="time" class="w-full rounded-xl border border-slate-200 px-3 py-2" required />
              </div>
            </div>

            <div class="flex items-center gap-2 mt-2">
              <button class="px-4 py-2 rounded-full text-white font-semibold" style="background:var(--brand)" type="submit">
                Book Appointment
              </button>
              <span id="publicBookError" class="text-red-600 text-sm"></span>
            </div>
          </form>
        </div>

        <!-- Current Tasks (admin-created only) -->
        <section class="mt-6 rounded-2xl bg-white p-5 shadow-soft">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold">Current Tasks (from Admin)</h2>
            <button id="refreshTasksBtn" class="px-3 py-1.5 rounded-full border border-slate-200 hover:bg-slate-50">Refresh</button>
          </div>
          <div id="taskContainer" class="mt-4 grid gap-3"></div>
        </section>
      </section>

      <!-- Right: My Appointments (local) -->
      <aside class="lg:col-span-1 sticky top-24">
        <div class="rounded-2xl bg-white p-5 shadow-soft">
          <h3 class="text-lg font-bold">My Appointments</h3>
          <p class="text-slate-500 text-sm">Saved on this device only.</p>
          <div id="myAppointments" class="mt-3 grid gap-3"></div>
          <button id="clearAppointments" class="mt-2 px-3 py-1.5 rounded-full border border-slate-200 hover:bg-slate-50">
            Clear All
          </button>
        </div>
      </aside>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 left-0 right-0 mx-auto w-fit px-4 py-2 rounded-full text-white bg-slate-900/90 shadow-soft hidden">Saved</div>

  <script>
    const API_BASE = ""; // same origin
    const $ = (s, r=document)=>r.querySelector(s);
    const storage = {
      get(k, def){ try{ const v = localStorage.getItem(k); return v? JSON.parse(v) : def; } catch { return def; } },
      set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
    };

    function showToast(msg){
      const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
      setTimeout(()=> t.classList.add('hidden'), 1800);
    }

    // ---------- My Appointments (local only) ----------
    function renderAppointments(){
      const box = $('#myAppointments');
      const list = storage.get('volunteerAppointments', []);
      if(!list.length){
        box.innerHTML = '<div class="text-slate-500 text-sm">No appointments yet.</div>';
        return;
      }
      box.innerHTML = list.map((a, idx) => `
        <article class="rounded-xl border border-slate-200 p-3 bg-slate-50" data-appt-index="${idx}">
          <div class="font-semibold">${a.title}</div>
          <div class="text-sm text-slate-600">
            <strong>Date:</strong> ${a.date} • <strong>Time:</strong> ${a.startTime}${a.endTime?(' - '+a.endTime):''}
          </div>
          <div class="text-xs text-slate-500 mt-1">Phone: ${a.phone || '-'}</div>
          <div class="mt-2">
            <button class="px-3 py-1.5 rounded-full border border-slate-300 hover:bg-slate-100"
                    data-cancel
                    data-title="${a.title.replace(/"/g,'&quot;')}"
                    data-date="${a.date}"
                    data-time="${a.startTime || ''}"
                    data-phone="${a.phone || ''}">
              Cancel
            </button>
          </div>
        </article>
      `).join('');
    }
    $('#clearAppointments').addEventListener('click', async ()=>{
      const list = storage.get('volunteerAppointments', []);
      if(list.length && !confirm('Also cancel these bookings on the server?')) return;
    
      for(const a of list){
        try { await cancelOnServer(a); } catch(e) { /* ignore */ }
      }
      storage.set('volunteerAppointments', []);
      renderAppointments();
      showToast('All appointments canceled');
    });
    

    // ---------- Load admin-created tasks into Current Tasks ----------
    function escapeAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
    async function loadAdminTasks(){
      const wrap = $('#taskContainer');
      wrap.innerHTML = '<div class="text-slate-500">Loading…</div>';
      try {
        const r = await fetch(API_BASE + '/api/tasks');
        if(!r.ok){ wrap.innerHTML = '<div class="text-red-600">Failed to load tasks.</div>'; return; }
        const items = await r.json();
        if(!items.length){ wrap.innerHTML = '<div class="text-slate-500">No tasks yet.</div>'; return; }
        wrap.innerHTML = items.map(t => (`
          <article class="rounded-2xl border border-slate-200 bg-white p-4">
            <div class="flex items-start justify-between gap-3">
              <div>
                <h3 class="text-lg font-bold">${t.title}</h3>
                <p class="text-slate-600 text-sm">${t.description || ''}</p>
                <p class="text-slate-500 text-xs mt-1">
                  Capacity per slot: ${t.maxVolunteers ?? '—'} • Duration: ${t.slotDurationMins ?? 60}m
                </p>
              </div>
              <div>
                <button class="px-3 py-1.5 rounded-full text-white font-semibold hover:opacity-90"
                        style="background:var(--brand)"
                        data-volunteer
                        data-title="${escapeAttr(t.title)}">
                  Volunteer
                </button>
              </div>
            </div>
          </article>
        `)).join('');
      } catch {
        wrap.innerHTML = '<div class="text-red-600">Network error.</div>';
      }
    }
    $('#refreshTasksBtn').addEventListener('click', loadAdminTasks);

    // Prefill form when clicking "Volunteer" on a task
    document.addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-volunteer]');
      if(!btn) return;
      const title = btn.dataset.title || '';
      const select = document.getElementById('taskSelect');
      const otherInput = document.querySelector('input[name="taskOther"]');

      // pick matching option if exists; else use "Other"
      const match = Array.from(select.options).find(o => (o.value === title) || (o.textContent === title));
      if(match){
        select.value = match.value;
        if(match.value !== '__other__') { otherInput.value = ''; }
      } else {
        select.value = '__other__';
        otherInput.value = title;
      }

      // scroll to form and focus the first input
      document.getElementById('publicBookForm').scrollIntoView({behavior:'smooth', block:'start'});
      setTimeout(()=> document.querySelector('input[name="name"]').focus(), 300);
    });

    // ---------- Public booking form (NO login) ----------
    (function(){
      const form = document.getElementById('publicBookForm');
      const err  = document.getElementById('publicBookError');
      const dateInput = form.querySelector('input[name="date"]');
      // min date = today
      const today = new Date().toISOString().split('T')[0];
      dateInput.setAttribute('min', today);

      document.getElementById('taskSelect').addEventListener('change', (e)=>{
        if(e.target.value === '__other__'){
          form.querySelector('input[name="taskOther"]').focus();
        }
      });

      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        err.textContent = '';

        const fd = new FormData(form);
        const name = (fd.get('name')||'').trim();
        const phone = (fd.get('phone')||'').trim();
        const sel = fd.get('task');
        const other = (fd.get('taskOther')||'').trim();
        const taskTitle = (sel === '__other__') ? other : sel;
        const date = fd.get('date');
        const time = fd.get('time');

        if(!name || !phone || !taskTitle || !date || !time){
          err.textContent = 'Please fill all fields.';
          return;
        }

        try{
          const r = await fetch(API_BASE + '/api/public_book', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ name, phone, taskTitle, date, time })
          });
          const body = await r.json().catch(()=>({}));
          if(!r.ok){
            if(r.status === 409){
              err.textContent = 'That day is already booked for this task. Choose another date.';
            } else {
              err.textContent = body.error || 'Booking failed.';
            }
            return;
          }
          // Success: Only add to "My Appointments" (NOT to Current Tasks)
          const list = storage.get('volunteerAppointments', []);
          list.push({ title: taskTitle, date, startTime: time, endTime: '', phone, name });
          storage.set('volunteerAppointments', list);
          form.reset();
          renderAppointments();
          showToast(`Booked: ${taskTitle} on ${date} at ${time}`);
        }catch(ex){
          err.textContent = 'Network error. Please try again.';
        }
      });
    })();

    // Boot
    renderAppointments();
    loadAdminTasks();
  </script>
  <script>
    // Cancel one appointment (server + local)
    document.addEventListener('click', async (e)=>{
      const btn = e.target.closest('[data-cancel]');
      if(!btn) return;
    
      const taskTitle = btn.dataset.title || '';
      const date = btn.dataset.date || '';
      const time = btn.dataset.time || '';
      const phone = btn.dataset.phone || '';
    
      // first try with time
      let r = await fetch('/api/public_cancel', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ phone, taskTitle, date, time })
      });
    
      // if not found, try again without time
      if(r.status === 404){
        r = await fetch('/api/public_cancel', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ phone, taskTitle, date })
        });
      }
    
      const j = await r.json().catch(()=>({}));
      if(!r.ok){
        alert(j.error || 'Cancel failed');
        return;
      }
    
      // remove locally
      const list = JSON.parse(localStorage.getItem('volunteerAppointments') || '[]');
      const newList = list.filter(a => !(a.phone===phone && a.title===taskTitle && a.date===date && (!time || a.startTime===time)));
      localStorage.setItem('volunteerAppointments', JSON.stringify(newList));
      // re-render if you have renderAppointments()
      if(typeof renderAppointments==='function') renderAppointments();
      alert('Appointment canceled');
    });
    async function cancelOnServer(appt){
      // Try cancel with time first
      const payload = { phone: appt.phone, taskTitle: appt.title, date: appt.date };
      if (appt.startTime) payload.time = appt.startTime;
    
      let r = await fetch(API_BASE + '/api/public_cancel', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
    
      // If not found (time mismatch), retry without time
      if (r.status === 404) {
        delete payload.time;
        r = await fetch(API_BASE + '/api/public_cancel', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
      }
      return r.ok;
    }
    
    // ... keep the rest (clear all, booking, load tasks, etc.)
  </script>
  
</body>
</html>
